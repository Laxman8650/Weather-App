<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <img src="" alt="logo" />
        </div>
        <div class="controls">
          <div id="DateType">
            <input type="date" /><i class="fa-regular fa-calendar-days"></i>
          </div>
          <div class="location"><i class="fa-solid fa-location-dot"></i></div>
          <button id="toggle">Dark Mode</button>
        </div>
      </header>

      <!-- Main Information -->
      <main class="main-container">
        <section class="search">
          <input type="text" />
          <button id="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>Search
          </button>
        </section>
        <section class="curr-weather">
          <h2>CURRENT WEATHER</h2>
          <img src="" alt="Weather-icon" />
          <div class="weather-info">
            <p>Feels Like:</p>
            <p>High:</p>
            <p>Low:</p>
            <p>City Name:</p>
            <p>Current Temperature:</p>
            <p>Weather condition:</p>
          </div>
        </section>
        <section class="weather-details">
          <div class="details">
            <ul>
              <li>Humidity:</li>
              <li>Wind:</li>
              <li>UV Index:</li>
              <li>Pressure:</li>
            </ul>
          </div>
        </section>
        <section class="forecast">
          <h2>5-DAY FORECAST</h2>
          <ul>
            <li>Monday <i></i></li>
            <li>Tuesday</li>
            <li>Wednesday</li>
            <li>Thursday</li>
            <li>Friday</li>
          </ul>
        </section>
      </main>
      <!-- Footer -->
      <footer>Created By &copy;Laxman Singh</footer>
    </div>
  </body>
</html>
